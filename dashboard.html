<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omni Data Pro</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}


body{
background:#f4f7fb;
color:#222;
}


.container{
width:100%;
max-width:500px;
margin:auto;
padding:20px;
}



/* Header */

.header{

display:flex;
justify-content:space-between;
align-items:center;
background:#ffffff;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px #ddd;

}


.logo{

font-size:28px;
font-weight:bold;
color:#0066ff;

}


.profile{

font-size:25px;

}





/* Login */

.login-box{

background:white;
padding:25px;
margin-top:50px;
border-radius:20px;
box-shadow:0 5px 20px #ddd;

}


input{

width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;

}


button{

width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0066ff;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;

}


button:hover{

opacity:.8;

}





/* Dashboard */


.card{

background:white;
padding:20px;
margin-top:20px;
border-radius:18px;
box-shadow:0 5px 15px #ddd;

}



.service{

background:white;
padding:18px;
margin-top:15px;
border-radius:15px;
box-shadow:0 4px 12px #ddd;

}



.service h3{

margin-bottom:8px;

}



.hidden{

display:none;

}


</style>


</head>



<body>


<div class="container">



<!-- LOGIN PAGE -->


<div id="loginPage" class="login-box">


<h2>
Omni Data Pro Login
</h2>


<input id="username" placeholder="Username">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">

Login

</button>


</div>





<!-- DASHBOARD -->


<div id="dashboardPage" class="hidden">



<div class="header">


<div class="logo">
ODP
</div>


<div>
<h3>
Omni Data Pro
</h3>

<p>
Professional Data Services
</p>

</div>


<div class="profile">
👤
</div>


</div>





<div class="card">

<h2>
Welcome
</h2>

<p>
Select your service
</p>

</div>





<div class="service">

<h3>
Basic Data Entry
</h3>

<p>
Professional data entry service
</p>

<button onclick="openService('Basic Data Entry')">

Open

</button>

</div>





<div class="service">

<h3>
Online Data Entry
</h3>

<p>
Online information processing
</p>

<button onclick="openService('Online Data Entry')">

Open

</button>

</div>





<div class="service">

<h3>
E-Commerce Catalog
</h3>

<p>
Product listing management
</p>

<button onclick="openService('E-Commerce Catalog')">

Open

</button>

</div>
