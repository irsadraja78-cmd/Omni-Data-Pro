
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Omni Data Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo">
                ODP
            </div>

            <h1>Omni Data Pro</h1>
            <p>Welcome to the Professional Data Service Platform</p>
        </div>


        <!-- Profile Section -->
        <div class="profile-card">

            <div class="profile-image">
                <img src="https://via.placeholder.com/120"
                alt="Owner Photo">
            </div>

            <h2>Admin Profile</h2>

            <p>
                Professional Data Entry,
                Research & AI Solutions
            </p>

        </div>



        <!-- Login Box -->
        <div class="login-box">

            <h2>Login</h2>


            <input 
            type="email" 
            placeholder="Enter Email">


            <input 
            type="password" 
            placeholder="Enter Password">


            <button>
                Login
            </button>


            <p>
                <a href="#">
                    Forgot Password?
                </a>
            </p>


            <button class="signup">
                Sign Up
            </button>

        </div>



        <!-- AI Teacher Section -->
        <div class="ai-section">

            <div class="ai-logo">
                AI
            </div>

            <h2>
                AI Teacher
            </h2>

            <p>
                Your smart assistant for learning
                and professional data work.
            </p>

        </div>


    </div>


<script src="script.js"></script>

</body>
</html>
