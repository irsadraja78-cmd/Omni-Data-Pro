<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omni Data Pro - Commercial Dashboard</title>

</head>

<body>


<!-- LOGIN SYSTEM -->

<div id="loginPage">

<h1>Omni Data Pro</h1>

<p>Commercial Data Management Platform</p>


<input id="loginEmail" type="email" placeholder="Email">


<input id="loginPassword" type="password" placeholder="Password">


<button onclick="loginUser()">
Login
</button>


<button onclick="showForgotPassword()">
Forgot Password?
</button>


</div>





<!-- FORGOT PASSWORD -->

<div id="forgotPage" style="display:none;">


<h2>Password Recovery</h2>


<input id="recoverEmail" placeholder="Enter Email">


<button onclick="recoverPassword()">
Send Recovery
</button>


<button onclick="backToLogin()">
Back Login
</button>


</div>






<!-- MAIN APP -->

<div id="appPage" style="display:none;">



<!-- SIDEBAR -->

<aside id="sidebar">


<h2>
ODP
</h2>


<button onclick="openSection('dashboard')">
Dashboard
</button>


<button onclick="openSection('files')">
File Manager
</button>


<button onclick="openSection('clients')">
Clients
</button>


<button onclick="openSection('services')">
Services
</button>


<button onclick="openSection('settings')">
Settings
</button>


<button onclick="logoutUser()">
Logout
</button>


</aside>





<!-- MAIN CONTENT -->

<main>


<header>

<h1>
Omni Data Pro Dashboard
</h1>


<p>
Professional Business Management System
</p>


</header>


<!-- Dashboard Section -->


<section id="dashboard" class="section">


<h2>
Dashboard Overview
</h2>


<div>

<h3>Total Projects</h3>
<p id="projectCount">0</p>

</div>


<div>

<h3>Active Files</h3>
<p id="fileCount">0</p>

</div>


<div>

<h3>Clients</h3>
<p id="clientCount">0</p>

</div>


</section>
