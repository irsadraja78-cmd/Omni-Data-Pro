<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OmniData Pro</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>


<header class="topbar">
    <h1>OmniData Pro</h1>

    <button id="logout">
        Logout
    </button>
</header>



<main>


<!-- Authentication -->

<section id="auth-section">

    <div class="card">

        <h2>Login</h2>

        <input 
        id="login-email"
        type="email"
        placeholder="Email">


        <input 
        id="login-password"
        type="password"
        placeholder="Password">


        <button id="login-btn">
            Login
        </button>


        <button id="forgot-btn">
            Forgot Password?
        </button>


    </div>


</section>





<!-- Dashboard -->

<section id="dashboard-section">


<div class="card">

<h2>
Dashboard
</h2>


<div id="profile-info">
</div>


<div id="stats">
</div>


</div>


</section>






<!-- Workspace -->

<section id="workspace-section">


<div class="card">

<h2>
Workspace
</h2>


<button id="create-project">
Create Project
</button>


<div id="projects-list">
</div>


</div>


</section>






<!-- Files -->


<section id="files-section">


<div class="card">

<h2>
Files
</h2>


<input 
type="file"
id="file-upload">


<button id="upload-btn">
Upload
</button>


<div id="files-list">
</div>


</div>


</section>







<!-- Settings -->


<section id="settings-section">


<div class="card">


<h2>
Settings
</h2>


<div id="settings-area">
</div>


</div>


</section>





</main>




<script type="module" src="Script.js"></script>


</body>

</html>
