<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omni Data Pro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     AUTH AREA
========================= -->


<div id="auth-container">


    <!-- LOGIN -->

    <section id="login-section" class="auth-box">


        <div class="logo">

            Omni Data Pro

        </div>


        <h2>Login</h2>


        <input 
        type="email" 
        id="login-email"
        placeholder="Email">


        <input 
        type="password"
        id="login-password"
        placeholder="Password">


        <button id="login-btn">

            Login

        </button>



        <p>

            <a href="#" id="show-signup">

            Create Account

            </a>

        </p>


        <p>

            <a href="#" id="show-forgot">

            Forgot Password?

            </a>

        </p>


    </section>





    <!-- SIGNUP -->


    <section id="signup-section" class="auth-box hidden">


        <div class="logo">

            Omni Data Pro

        </div>


        <h2>Create Account</h2>


        <input
        type="text"
        id="signup-name"
        placeholder="Full Name">



        <input
        type="email"
        id="signup-email"
        placeholder="Email">



        <input
        type="password"
        id="signup-password"
        placeholder="Password">



        <button id="signup-btn">

            Signup

        </button>


        <p>

            <a href="#" id="show-login">

            Already have account?

            </a>

        </p>


    </section>





    <!-- FORGOT PASSWORD -->


    <section id="forgot-section" class="auth-box hidden">


        <h2>

            Reset Password

        </h2>



        <input
        type="email"
        id="forgot-email"
        placeholder="Email">



        <button id="reset-btn">

            Send Reset Link

        </button>



        <p>

            <a href="#" id="back-login">

            Back Login

            </a>

        </p>


    </section>



</div>





<!-- =========================
     MAIN APPLICATION
========================= -->


<div id="app-container" class="hidden">



<!-- SIDEBAR -->


<aside id="sidebar">


<h2>

Omni Data Pro

</h2>



<nav>


<button data-page="dashboard">

Dashboard

</button>


<button data-page="ai">

AI Chat

</button>


<button data-page="files">

Files

</button>



<button data-page="workspace">

Workspace

</button>



<button data-page="search">

Search

</button>



<button data-page="profile">

Profile

</button>



<button data-page="settings">

Settings

</button>



<button data-page="security">

Security

</button>


<button id="logout-btn">

Logout

</button>


</nav>


</aside>





<!-- MAIN CONTENT AREA -->


<main id="main-content">


<!-- बाकी sections Part 2 में आएंगे -->


</main>



</div>



<script type="module" src="script.js"></script>


</body>

</html>
