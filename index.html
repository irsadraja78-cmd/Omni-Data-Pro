<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omni Data Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

<!-- LOGIN -->

<section id="loginSection" class="auth">

<h1>Omni Data Pro</h1>
<p>Freelancer Workspace</p>

<input id="loginEmail" type="email" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>
<a onclick="showSignup()">Create Account</a>
</p>

<p>
<a onclick="showForgot()">Forgot Password?</a>
</p>

</section>



<!-- SIGNUP -->

<section id="signupSection" class="auth hidden">

<h2>Create Account</h2>

<input id="name" placeholder="Full Name">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Sign Up</button>

<p>
<a onclick="showLogin()">Back Login</a>
</p>

</section>



<!-- FORGOT -->

<section id="forgotSection" class="auth hidden">

<h2>Reset Password</h2>

<input id="resetEmail" placeholder="Email">

<button onclick="forgotPassword()">
Reset
</button>

<p>
<a onclick="showLogin()">Back Login</a>
</p>

</section>





<!-- DASHBOARD -->

<section id="dashboard" class="hidden">


<aside>

<h2>ODP</h2>

<button onclick="openPage('home')">
Dashboard
</button>

<button onclick="openPage('work')">
My Work
</button>

<button onclick="openPage('files')">
Files
</button>

<button onclick="openPage('profile')">
Profile
</button>

<button onclick="logout()">
Logout
</button>


</aside>




<main>


<div id="home" class="page">

<h1>
Welcome To Omni Data Pro
</h1>

<div class="cards">

<div>
<h3>Tasks</h3>
<p>0</p>
</div>

<div>
<h3>Completed</h3>
<p>0</p>
</div>


<div>
<h3>Files</h3>
<p>0</p>
</div>


</div>

</div>
