<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omni Data Pro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- LOGIN BOX -->

<div class="auth-box" id="loginBox">


<h1>Omni Data Pro</h1>

<p>Freelancer Workspace Platform</p>


<input 
id="loginEmail"
type="email"
placeholder="Email Address">


<input 
id="loginPassword"
type="password"
placeholder="Password">



<button onclick="loginUser()">
Login
</button>


<div class="links">

<a onclick="showSignup()">
Create Account
</a>


<a onclick="showForgot()">
Forgot Password?
</a>

</div>


</div>







<!-- SIGNUP BOX -->

<div class="auth-box hidden" id="signupBox">


<h2>Create Freelancer Account</h2>


<input
id="signupName"
placeholder="Full Name">


<input
id="signupEmail"
type="email"
placeholder="Email">


<input
id="signupPassword"
type="password"
placeholder="Create Password">


<button onclick="registerUser()">
Sign Up
</button>


<div class="links">

<a onclick="showLogin()">
Already have account?
</a>

</div>


</div>








<!-- FORGOT PASSWORD -->

<div class="auth-box hidden" id="forgotBox">


<h2>Password Reset</h2>


<input
id="forgotEmail"
type="email"
placeholder="Registered Email">



<button onclick="resetPassword()">
Reset Password
</button>



<div class="links">

<a onclick="showLogin()">
Back To Login
</a>

</div>


</div>







<!-- DASHBOARD PLACEHOLDER -->

<div class="hidden" id="dashboard">


<h2>
Welcome To Omni Data Pro
</h2>


<p>
Freelancer Dashboard Loading...
</p>


<button onclick="logoutUser()">
Logout
</button>


</div>



</div>





<script src="script.js"></script>

</body>

</html>
