<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Data Pro — Enterprise Core</title>
    <!-- Master Stylesheet Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Authentication Screen (Visible when user is logged out) -->
    <div id="auth-container" class="hidden">
        <div class="auth-card">
            <h2 style="margin-bottom: 20px; color: var(--primary-color);" data-i18n="welcome">ओमनी डेटा प्रो में आपका स्वागत है</h2>
            
            <!-- Login Form -->
            <form id="login-form">
                <input type="email" id="login-email" class="form-control" placeholder="Email Address" required>
                <input type="password" id="login-password" class="form-control" placeholder="Password" required>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- 2. Main Application Container (Visible when user is logged in) -->
    <div id="app-container" class="hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">
                    <h2>Omni Data Pro</h2>
                </div>
                <ul class="sidebar-menu">
                    <li class="menu-item active" data-target="dashboard-page" data-i18n="dashboard">डैशबोर्ड</li>
                    <li class="menu-item" data-target="workspace-page" data-i18n="workspace">वर्कस्पेस</li>
                    <li class="menu-item" data-target="files-page" data-i18n="files">फाइलें</li>
                    <li class="menu-item" data-target="ai-page" data-i18n="aiChat">एआई चैट</li>
                    <li class="menu-item" data-target="security-page" data-i18n="security">सुरक्षा</li>
                    <li class="menu-item" data-target="settings-page" data-i18n="settings">सेटिंग्स</li>
                    <li class="menu-item" data-target="profile-page" data-i18n="profile">प्रोफाइल</li>
                </ul>
            </div>
            
            <div class="sidebar-bottom">
                <button id="logout-button" class="btn" style="width: 100%; background-color: var(--danger-color);">Logout</button>
            </div>
        </aside>

        <!-- Dynamic Main Content Area -->
        <main class="main-content">
            
            <!-- Dashboard Page -->
            <div id="dashboard-page" class="app-page">
                <h1 data-i18n="dashboard">डैशबोर्ड</h1>
                <p style="margin-top: 10px; color: var(--text-muted);">Welcome to your enterprise management command center.</p>
            </div>

            <!-- Workspace Page -->
            <div id="workspace-page" class="app-page hidden">
                <h1 data-i18n="workspace">वर्कस्पेस</h1>
            </div>

            <!-- Files Page -->
            <div id="files-page" class="app-page hidden">
                <h1 data-i18n="files">फाइलें</h1>
                <button class="btn" style="margin-top: 15px;" data-i18n="uploadBtn">फाइल अपलोड करें</button>
            </div>

            <!-- AI Chat Page -->
            <div id="ai-page" class="app-page hidden">
                <h1 data-i18n="aiChat">एआई चैट</h1>
            </div>

            <!-- Security Page -->
            <div id="security-page" class="app-page hidden">
                <h1 data-i18n="security">सुरक्षा</h1>
            </div>

            <!-- Settings Page (With Indian Multi-Language Dropdown) -->
            <div id="settings-page" class="app-page hidden">
                <h1 data-i18n="settings">सेटिंग्स</h1>
                <div style="margin-top: 20px; max-width: 400px;">
                    <label for="language-selector" style="display: block; margin-bottom: 8px; font-weight: 500;">भाषा चुनें / Select Language:</label>
                    <select id="language-selector" class="form-control">
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="en">English</option>
                        <option value="bn">বাংলা (Bengali)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="mr">मराठी (Marathi)</option>
                        <option value="gu">ગુજરાતી (Gujarati)</option>
                        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="ml">മലയാളം (Malayalam)</option>
                    </select>
                </div>
            </div>

            <!-- Profile Page -->
            <div id="profile-page" class="app-page hidden">
                <h1 data-i18n="profile">प्रोफाइल</h1>
            </div>

        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Master Scripts Initialization (Modular ES6 Scripts) -->
    <script type="module" src="supabase.js"></script>
    <script type="module" src="i18n.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
